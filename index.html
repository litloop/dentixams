<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  />

  <meta
    name="description"
    content="FeelFrame™ — visual stories for human moments. Some feelings deserve to be seen."
  />

  <meta name="theme-color" content="#f5f3ee" />

  <title>FeelFrame™ — Some feelings deserve to be seen.</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

  <link
    href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap"
    rel="stylesheet"
  />

  <link rel="stylesheet" href="style.css" />
</head>

<body class="home-page">

  <main>

    <!-- =======================================================
         HOME HEADER
         ======================================================= -->

    <div class="home-container">

      <header class="home-header">

        <a
          href="index.html"
          class="home-logo"
          aria-label="FeelFrame home"
        >
          FeelFrame™
        </a>

      </header>


      <!-- =====================================================
           HERO
           ===================================================== -->

      <section class="home-hero">

        <h1 class="home-hero-title">
          Some feelings deserve to be seen.
        </h1>

        <a
          href="create.html"
          class="home-hero-cta"
        >
          <span>Make it yours</span>

          <span
            class="home-hero-cta-arrow"
            aria-hidden="true"
          >
            →
          </span>
        </a>

      </section>

    </div>


    <!-- =======================================================
         FEATURED COVERFLOW
         
         No section heading.
         The visual experience begins immediately.
         ======================================================= -->

    <section
      class="featured-section"
      aria-label="Featured FeelFrame moments"
    >

      <div
        class="coverflow-viewport"
        id="coverflowViewport"
        aria-label="Featured visual stories carousel"
      >

        <div
          class="coverflow-track"
          id="coverflowTrack"
        >
          <!-- Cards generated from data.json -->
        </div>

      </div>


      <!-- =====================================================
           COVERFLOW CONTROLS
           ===================================================== -->

      <div class="coverflow-controls">

        <button
          class="coverflow-arrow"
          id="coverflowPrev"
          type="button"
          aria-label="Previous featured story"
        >
          ←
        </button>

        <div
          class="coverflow-dots"
          id="coverflowDots"
          aria-label="Featured story positions"
        ></div>

        <button
          class="coverflow-arrow"
          id="coverflowNext"
          type="button"
          aria-label="Next featured story"
        >
          →
        </button>

      </div>

    </section>


    <!-- =======================================================
         PINTEREST-STYLE STORY BOARD
         
         No "More FeelFrame Stories" heading.
         No extra section label.
         The visual board follows naturally.
         ======================================================= -->

    <div class="home-container">

      <section
        class="stories-section"
        aria-label="FeelFrame visual stories"
      >

        <div
          class="home-story-grid"
          id="homeStoryGrid"
          aria-live="polite"
        >
          <!-- Stories generated from data.json -->
        </div>

      </section>

    </div>

  </main>


  <!-- =========================================================
       STICKY MOBILE / GLOBAL NAV
       ========================================================= -->

  <nav
    class="home-bottom-nav"
    aria-label="Primary navigation"
  >

    <a
      href="index.html"
      class="active"
      aria-current="page"
    >
      Home
    </a>

    <a href="explore.html">
      Explore
    </a>

    <a href="create.html">
      Create
    </a>

  </nav>


  <!-- =========================================================
       HOME SCRIPT
       ========================================================= -->

  <script>

    /* =========================================================
       CONFIG
       ========================================================= */

    const DATA_URL = "data.json";

    let stories = [];
    let featuredStories = [];

    let coverflowIndex = 0;

    let touchStartX = 0;
    let touchCurrentX = 0;
    let isDragging = false;


    /* =========================================================
       DOM
       ========================================================= */

    const homeStoryGrid =
      document.getElementById("homeStoryGrid");

    const coverflowTrack =
      document.getElementById("coverflowTrack");

    const coverflowDots =
      document.getElementById("coverflowDots");

    const coverflowViewport =
      document.getElementById("coverflowViewport");

    const coverflowPrev =
      document.getElementById("coverflowPrev");

    const coverflowNext =
      document.getElementById("coverflowNext");


    /* =========================================================
       ESCAPE HTML
       ========================================================= */

    function escapeHTML(value) {

      if (value === null || value === undefined) {
        return "";
      }

      return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

    }


    /* =========================================================
       FORMAT PRICE
       ========================================================= */

    function formatNaira(value) {

      const number = Number(value);

      if (!Number.isFinite(number)) {
        return "";
      }

      return `₦${number.toLocaleString("en-NG")}`;

    }


    /* =========================================================
       PROMPT PRODUCT
       ========================================================= */

    function createPromptProduct(story) {

      if (!story.promptTitle) {
        return "";
      }

      const currentPrice =
        story.price !== undefined
          ? formatNaira(story.price)
          : "";

      const compareAt =
        story.compareAt !== undefined
          ? formatNaira(story.compareAt)
          : "";

      const hasComparePrice =
        compareAt && currentPrice;


      const priceHTML = hasComparePrice

        ? `
          <div class="prompt-price">

            <span class="prompt-old-price">
              ${escapeHTML(compareAt)}
            </span>

            <span class="prompt-current-price">
              ${escapeHTML(currentPrice)}
            </span>

          </div>
        `

        : `
          <div class="prompt-price">

            <span class="prompt-current-price">
              ${escapeHTML(currentPrice)}
            </span>

          </div>
        `;


      const buttonHTML =
        story.selarUrl &&
        story.selarUrl !== "REAL-SELAR-LINK"

          ? `
            <a
              class="prompt-get-button"
              href="${escapeHTML(story.selarUrl)}"
              target="_blank"
              rel="noopener noreferrer"
              onclick="event.stopPropagation()"
            >
              Get prompt →
            </a>
          `

          : `
            <span
              class="prompt-get-button"
              aria-label="Prompt product coming soon"
            >
              Get prompt →
            </span>
          `;


      return `
        <div class="prompt-product">

          <p class="prompt-product-title">

            <span
              class="prompt-lock"
              aria-hidden="true"
            >
              🔐
            </span>

            <span>
              ${escapeHTML(story.promptTitle)}
            </span>

          </p>


          <p class="prompt-product-description">
            The creative prompt behind this visual.
          </p>


          <div class="prompt-product-bottom">

            ${priceHTML}

            ${buttonHTML}

          </div>

        </div>
      `;

    }


    /* =========================================================
       CREATE COVERFLOW CARD
       ========================================================= */

    function createCoverflowCard(story, index) {

      const card =
        document.createElement("article");

      card.className = "coverflow-card";

      card.dataset.index = index;
      card.dataset.id = story.id || "";


      card.innerHTML = `

        <img
          class="coverflow-card-image"
          src="${escapeHTML(story.image)}"
          alt="${escapeHTML(
            story.title ||
            story.quote ||
            story.emotion ||
            "FeelFrame visual story"
          )}"
          loading="${index === 0 ? "eager" : "lazy"}"
          draggable="false"
        >


        <div class="coverflow-card-content">

          ${
            story.campaign
              ? `
                <div class="coverflow-card-campaign">
                  ${escapeHTML(story.campaign)}
                </div>
              `
              : ""
          }


          <h2 class="coverflow-card-title">

            ${escapeHTML(
              story.title ||
              story.quote ||
              story.moment ||
              "A human moment"
            )}

          </h2>


          ${
            story.emotion
              ? `
                <div class="coverflow-card-emotion">
                  ${escapeHTML(story.emotion)}
                </div>
              `
              : ""
          }

        </div>

      `;


      card.addEventListener("click", () => {

        if (isDragging) {
          return;
        }


        const clickedIndex =
          Number(card.dataset.index);


        if (
          Number.isFinite(clickedIndex) &&
          clickedIndex !== coverflowIndex
        ) {

          coverflowIndex =
            clickedIndex;

          updateCoverflow();

          return;

        }


        if (story.id) {

          window.location.href =
            `story.html?id=${encodeURIComponent(
              story.id
            )}`;

        }

      });


      return card;

    }


    /* =========================================================
       CREATE STORY CARD
       ========================================================= */

    function createStoryCard(story) {

      const link =
        document.createElement("a");

      link.className =
        "home-story-card";

      link.href =
        `story.html?id=${encodeURIComponent(
          story.id
        )}`;


      const image =
        story.image || "";


      link.innerHTML = `

        <div class="home-story-card-image-wrap">

          <img
            class="home-story-card-image"
            src="${escapeHTML(image)}"
            alt="${escapeHTML(
              story.title ||
              story.quote ||
              story.moment ||
              "FeelFrame visual story"
            )}"
            loading="lazy"
          >

        </div>


        <div class="home-story-card-body">

          <div class="home-story-card-meta">

            <span>
              ${escapeHTML(
                story.campaign ||
                story.moment ||
                "FeelFrame"
              )}
            </span>


            ${
              story.emotion
                ? `
                  <span>
                    ${escapeHTML(
                      story.emotion
                    )}
                  </span>
                `
                : ""
            }

          </div>


          <h2 class="home-story-card-title">

            ${escapeHTML(
              story.title ||
              story.quote ||
              story.moment ||
              "A human moment"
            )}

          </h2>


          ${
            story.description
              ? `
                <p class="home-story-card-description">
                  ${escapeHTML(
                    story.description
                  )}
                </p>
              `
              : story.context
                ? `
                  <p class="home-story-card-description">
                    ${escapeHTML(
                      story.context
                    )}
                  </p>
                `
                : ""
          }


          ${createPromptProduct(story)}

        </div>

      `;


      /*
       * Prevent prompt interaction from
       * navigating to the story page.
       */

      const prompt =
        link.querySelector(
          ".prompt-product"
        );


      if (prompt) {

        prompt.addEventListener(
          "click",
          (event) => {
            event.stopPropagation();
          }
        );

      }


      return link;

    }


    /* =========================================================
       RENDER STORY BOARD
       ========================================================= */

    function renderHomeStories() {

      if (!homeStoryGrid) {
        return;
      }


      homeStoryGrid.innerHTML = "";


      if (!stories.length) {

        homeStoryGrid.innerHTML = `
          <div class="home-empty">
            No stories available yet.
          </div>
        `;

        return;

      }


      stories.forEach((story) => {

        homeStoryGrid.appendChild(
          createStoryCard(story)
        );

      });

    }


    /* =========================================================
       BUILD COVERFLOW
       ========================================================= */

    function buildCoverflow() {

      if (!coverflowTrack) {
        return;
      }


      coverflowTrack.innerHTML = "";

      coverflowDots.innerHTML = "";


      if (!featuredStories.length) {

        coverflowTrack.innerHTML = `
          <div class="home-empty">
            Featured moments will appear here.
          </div>
        `;

        return;

      }


      featuredStories.forEach(
        (story, index) => {

          const card =
            createCoverflowCard(
              story,
              index
            );


          coverflowTrack.appendChild(
            card
          );


          const dot =
            document.createElement(
              "button"
            );


          dot.type = "button";

          dot.className =
            "coverflow-dot";


          dot.setAttribute(
            "aria-label",
            `Go to featured story ${index + 1}`
          );


          dot.addEventListener(
            "click",
            () => {

              coverflowIndex =
                index;

              updateCoverflow();

            }
          );


          coverflowDots.appendChild(
            dot
          );

        }
      );


      coverflowIndex = 0;

      updateCoverflow();

    }


    /* =========================================================
       COVERFLOW POSITION ENGINE
       ========================================================= */

    function getRelativePosition(
      cardIndex,
      activeIndex,
      total
    ) {

      let difference =
        cardIndex - activeIndex;


      /*
       * Circular positioning allows
       * continuous carousel movement.
       */

      if (difference > total / 2) {

        difference -= total;

      }


      if (difference < -total / 2) {

        difference += total;

      }


      return difference;

    }


    function updateCoverflow() {

      const cards =
        Array.from(
          document.querySelectorAll(
            ".coverflow-card"
          )
        );


      const total =
        cards.length;


      if (!total) {
        return;
      }


      cards.forEach(
        (card, index) => {

          const position =
            getRelativePosition(
              index,
              coverflowIndex,
              total
            );


          card.classList.remove(
            "is-center",
            "is-left",
            "is-right",
            "is-far-left",
            "is-far-right",
            "is-hidden"
          );


          if (position === 0) {

            card.classList.add(
              "is-center"
            );

          } else if (position === -1) {

            card.classList.add(
              "is-left"
            );

          } else if (position === 1) {

            card.classList.add(
              "is-right"
            );

          } else if (position === -2) {

            card.classList.add(
              "is-far-left"
            );

          } else if (position === 2) {

            card.classList.add(
              "is-far-right"
            );

          } else {

            card.classList.add(
              "is-hidden"
            );

          }

        }
      );


      const dots =
        Array.from(
          document.querySelectorAll(
            ".coverflow-dot"
          )
        );


      dots.forEach(
        (dot, index) => {

          dot.classList.toggle(
            "is-active",
            index === coverflowIndex
          );

        }
      );

    }


    /* =========================================================
       NEXT / PREVIOUS
       ========================================================= */

    function goNext() {

      if (!featuredStories.length) {
        return;
      }


      coverflowIndex =
        (
          coverflowIndex + 1
        ) %
        featuredStories.length;


      updateCoverflow();

    }


    function goPrevious() {

      if (!featuredStories.length) {
        return;
      }


      coverflowIndex =
        (
          coverflowIndex -
          1 +
          featuredStories.length
        ) %
        featuredStories.length;


      updateCoverflow();

    }


    coverflowNext.addEventListener(
      "click",
      goNext
    );


    coverflowPrev.addEventListener(
      "click",
      goPrevious
    );


    /* =========================================================
       TOUCH / SWIPE
       ========================================================= */

    coverflowViewport.addEventListener(
      "pointerdown",
      (event) => {

        isDragging = false;

        touchStartX =
          event.clientX;

        touchCurrentX =
          event.clientX;


        coverflowViewport.classList.add(
          "is-dragging"
        );

      }
    );


    coverflowViewport.addEventListener(
      "pointermove",
      (event) => {

        if (
          !touchStartX &&
          touchStartX !== 0
        ) {
          return;
        }


        touchCurrentX =
          event.clientX;


        if (
          Math.abs(
            touchCurrentX -
            touchStartX
          ) > 8
        ) {

          isDragging = true;

        }

      }
    );


    coverflowViewport.addEventListener(
      "pointerup",
      () => {

        const difference =
          touchCurrentX -
          touchStartX;


        coverflowViewport.classList.remove(
          "is-dragging"
        );


        if (
          Math.abs(difference) > 55
        ) {

          if (difference < 0) {

            goNext();

          } else {

            goPrevious();

          }

        }


        /*
         * Small delay prevents a swipe
         * from triggering a card click.
         */

        setTimeout(() => {

          touchStartX = 0;
          touchCurrentX = 0;
          isDragging = false;

        }, 50);

      }
    );


    coverflowViewport.addEventListener(
      "pointercancel",
      () => {

        coverflowViewport.classList.remove(
          "is-dragging"
        );


        touchStartX = 0;
        touchCurrentX = 0;
        isDragging = false;

      }
    );


    /* =========================================================
       KEYBOARD SUPPORT
       ========================================================= */

    document.addEventListener(
      "keydown",
      (event) => {

        if (
          event.key === "ArrowRight"
        ) {

          goNext();

        }


        if (
          event.key === "ArrowLeft"
        ) {

          goPrevious();

        }

      }
    );


    /* =========================================================
       LOAD DATA
       ========================================================= */

    async function loadHome() {

      try {

        const response =
          await fetch(
            DATA_URL
          );


        if (!response.ok) {

          throw new Error(
            `Could not load ${DATA_URL}`
          );

        }


        const data =
          await response.json();


        /*
         * Supports:
         *
         * [
         *   {...},
         *   {...}
         * ]
         *
         * or:
         *
         * {
         *   stories: [...]
         * }
         */

        stories =
          Array.isArray(data)

            ? data

            : Array.isArray(
                data.stories
              )

              ? data.stories

              : [];


        /*
         * Featured stories are controlled
         * entirely through data.json.
         */

        featuredStories =
          stories.filter(
            (story) =>
              story.featured === true
          );


        renderHomeStories();

        buildCoverflow();

      } catch (error) {

        console.error(
          "FeelFrame Home:",
          error
        );


        if (homeStoryGrid) {

          homeStoryGrid.innerHTML = `
            <div class="home-empty">
              FeelFrame stories could not be loaded.
            </div>
          `;

        }

      }

    }


    /* =========================================================
       INIT
       ========================================================= */

    loadHome();

  </script>

</body>
</html>
