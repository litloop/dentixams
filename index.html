<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <meta
    name="description"
    content="FeelFrame™ — Some feelings deserve to be seen."
  />

  <meta
    name="theme-color"
    content="#f5f3ee"
  />

  <title>
    FeelFrame™ — Some feelings deserve to be seen.
  </title>

  <!-- =========================================================
       FONTS
       ========================================================= -->

  <link
    rel="preconnect"
    href="https://fonts.googleapis.com"
  />

  <link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
  />

  <link
    href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap"
    rel="stylesheet"
  />

  <!-- =========================================================
       MAIN STYLESHEET
       ========================================================= -->

  <link
    rel="stylesheet"
    href="style.css"
  />
</head>


<body class="home-page">


  <!-- =========================================================
       HEADER
       ========================================================= -->

  <header class="site-header">

    <div class="site-header-inner">

      <a
        href="index.html"
        class="brand"
        aria-label="FeelFrame home"
      >
        FeelFrame<span class="brand-mark">™</span>
      </a>

    </div>

  </header>



  <!-- =========================================================
       MAIN CONTENT
       ========================================================= -->

  <main id="main-content">


    <!-- =======================================================
         HOME HERO

         The hero contains:

         1. Emotional headline
         2. Creation CTA
         3. Immediate 3D Cover Flow

         The Cover Flow remains directly inside the hero so
         visitors encounter the visual product immediately.
         ======================================================= -->

    <section
      class="home-hero"
      aria-labelledby="homeHeroTitle"
    >


      <!-- =====================================================
           HERO INTRO
           ===================================================== -->

      <div class="home-hero-intro">

        <div class="home-hero-copy">

          <h1
            class="home-hero-title"
            id="homeHeroTitle"
          >
            Some feelings deserve to be seen.
          </h1>

        </div>


        <!-- ===================================================
             HERO CTA
             =================================================== -->

        <a
          href="create.html"
          class="hero-cta"
          aria-label="Make your own FeelFrame"
        >

          <span>
            Make it yours
          </span>

          <span
            class="hero-cta-arrow"
            aria-hidden="true"
          >
            →
          </span>

        </a>

      </div>



      <!-- =====================================================
           FEATURED / 3D COVER FLOW

           Featured stories are generated from data.json
           by script.js.
           ===================================================== -->

      <section
        class="featured-section"
        aria-label="FeelFrame visual moments"
      >


        <!-- ===================================================
             COVER FLOW VIEWPORT
             =================================================== -->

        <div
          class="coverflow"
          id="coverflowViewport"
          aria-label="Featured FeelFrame moments"
          role="region"
        >


          <!-- =================================================
               COVER FLOW TRACK

               Cards are generated by script.js.
               ================================================= -->

          <div
            class="coverflow-track"
            id="coverflowTrack"
          >

            <!--
              Featured cards are generated here by script.js
              from data.json.
            -->

          </div>


        </div>



        <!-- ===================================================
             COVER FLOW CONTROLS
             =================================================== -->

        <div
          class="coverflow-controls"
          aria-label="Featured story controls"
        >


          <div class="coverflow-buttons">


            <!-- =================================================
                 PREVIOUS BUTTON

                 ID intentionally matches production script.js.
                 ================================================= -->

            <button
              type="button"
              class="coverflow-button"
              id="coverflowPrevious"
              aria-label="Previous featured story"
            >
              ←
            </button>



            <!-- ===============================================
                 DOT NAVIGATION

                 Dots are generated by script.js.
                 =============================================== -->

            <div
              class="coverflow-dots"
              id="coverflowDots"
              role="tablist"
              aria-label="Featured stories"
            >

              <!--
                Dots generated by JavaScript.
              -->

            </div>



            <!-- ===============================================
                 NEXT BUTTON
                 =============================================== -->

            <button
              type="button"
              class="coverflow-button"
              id="coverflowNext"
              aria-label="Next featured story"
            >
              →
            </button>


          </div>


        </div>


      </section>


    </section>



    <!-- =======================================================
         STORY BOARD

         Pinterest / Bento-style visual exploration remains
         separate from the hero Cover Flow.

         Cards are generated by script.js from data.json.
         ======================================================= -->

    <section
      class="story-board-section"
      aria-labelledby="storyBoardTitle"
    >


      <!-- =====================================================
           SECTION HEADING
           ===================================================== -->

      <div class="section-heading">

        <div>

          <p class="section-eyebrow">
            Explore
          </p>

          <h2
            class="section-title"
            id="storyBoardTitle"
          >
            Moments worth seeing.
          </h2>

        </div>

      </div>



      <!-- =====================================================
           STORY BOARD

           IMPORTANT:
           The ID matches the production script.js:
           #homeStoryGrid
           ===================================================== -->

      <div
        class="story-board"
        id="homeStoryGrid"
        aria-live="polite"
      >

        <!--
          Story cards are generated here by script.js
          from data.json.
        -->

      </div>


    </section>



    <!-- =======================================================
         EMPTY STATE

         Retained as part of the existing page structure.
         script.js also provides dynamic empty states when
         required.
         ======================================================= -->

    <section
      class="empty-state"
      id="emptyState"
      hidden
      aria-live="polite"
    >

      <div class="empty-state-inner">

        <span
          class="empty-state-mark"
          aria-hidden="true"
        >
          ✦
        </span>

        <h2>
          Nothing here yet.
        </h2>

        <p>
          New visual moments are coming soon.
        </p>

      </div>

    </section>


  </main>



  <!-- =========================================================
       STICKY MOBILE NAVIGATION
       ========================================================= -->

  <nav
    class="bottom-nav"
    aria-label="Primary navigation"
  >


    <!-- =======================================================
         HOME
         ======================================================= -->

    <a
      href="index.html"
      class="bottom-nav-item is-active"
      aria-current="page"
    >

      <span
        class="bottom-nav-icon"
        aria-hidden="true"
      >
        ⌂
      </span>

      <span class="bottom-nav-label">
        Home
      </span>

    </a>



    <!-- =======================================================
         EXPLORE
         ======================================================= -->

    <a
      href="explore.html"
      class="bottom-nav-item"
    >

      <span
        class="bottom-nav-icon"
        aria-hidden="true"
      >
        ◇
      </span>

      <span class="bottom-nav-label">
        Explore
      </span>

    </a>



    <!-- =======================================================
         CREATE
         ======================================================= -->

    <a
      href="create.html"
      class="bottom-nav-item"
    >

      <span
        class="bottom-nav-icon"
        aria-hidden="true"
      >
        ＋
      </span>

      <span class="bottom-nav-label">
        Create
      </span>

    </a>


  </nav>



  <!-- =========================================================
       PRODUCTION JAVASCRIPT
       =========================================================

       All FeelFrame™ behavior now lives in script.js.

       This prevents two separate Cover Flow engines from
       competing with each other and keeps the architecture:

       index.html
            ↓
       style.css
            ↓
       script.js
            ↓
       data.json

       ========================================================= -->

  <script
    src="script.js"
    defer
  ></script>


</body>
</html>
