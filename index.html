<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <meta
    name="description"
    content="FeelFrame™ — Some feelings deserve to be seen."
  />

  <meta
    name="theme-color"
    content="#f5f3ee"
  />

  <title>FeelFrame™ — Some feelings deserve to be seen.</title>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

  <link
    href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap"
    rel="stylesheet"
  />

  <!-- Main stylesheet -->
  <link rel="stylesheet" href="style.css" />
</head>

<body>

  <!-- =========================================================
       HEADER
       ========================================================= -->

  <header class="site-header">
    <div class="site-header-inner">

      <a
        href="index.html"
        class="brand"
        aria-label="FeelFrame home"
      >
        FeelFrame<span class="brand-mark">™</span>
      </a>

    </div>
  </header>


  <!-- =========================================================
       MAIN
       ========================================================= -->

  <main id="main-content">

    <!-- =======================================================
         HOME HERO
         ======================================================= -->

    <section
      class="home-hero"
      aria-labelledby="homeHeroTitle"
    >

      <!-- Hero introduction -->

      <div class="home-hero-intro">

        <h1
          class="home-hero-title"
          id="homeHeroTitle"
        >
          Some feelings deserve to be seen.
        </h1>


        <a
          href="create.html"
          class="home-hero-cta"
          aria-label="Make your own FeelFrame"
        >
          <span>Make it yours</span>

          <span
            class="home-hero-cta-arrow"
            aria-hidden="true"
          >
            →
          </span>
        </a>

      </div>


      <!-- =====================================================
           FEATURED / 3D COVER FLOW
           
           This now lives INSIDE the hero.
           ===================================================== -->

      <section
        class="featured-section"
        aria-label="FeelFrame visual moments"
      >

        <div
          class="coverflow-viewport"
          id="coverflowViewport"
          aria-label="Featured FeelFrame moments"
        >

          <div
            class="coverflow-track"
            id="coverflowTrack"
          >
            <!--
              Featured cards are generated here by script.js
              from data.json.
            -->
          </div>

        </div>


        <!-- Cover Flow controls -->

        <div
          class="coverflow-controls"
          aria-label="Featured story controls"
        >

          <button
            type="button"
            class="coverflow-arrow coverflow-prev"
            id="coverflowPrev"
            aria-label="Previous featured story"
          >
            ←
          </button>


          <div
            class="coverflow-dots"
            id="coverflowDots"
            role="tablist"
            aria-label="Featured stories"
          >
            <!-- Dots generated by JavaScript -->
          </div>


          <button
            type="button"
            class="coverflow-arrow coverflow-next"
            id="coverflowNext"
            aria-label="Next featured story"
          >
            →
          </button>

        </div>

      </section>

    </section>


    <!-- =======================================================
         STORY BOARD
         ======================================================= -->

    <section
      class="story-board-section"
      aria-labelledby="storyBoardTitle"
    >

      <div class="section-heading">

        <div>
          <p class="section-eyebrow">
            Explore
          </p>

          <h2
            class="section-title"
            id="storyBoardTitle"
          >
            Moments worth seeing.
          </h2>
        </div>

      </div>


      <div
        class="story-board"
        id="storyBoard"
        aria-live="polite"
      >
        <!--
          Story cards are generated here by script.js
          from data.json.
        -->
      </div>

    </section>


    <!-- =======================================================
         EMPTY STATE
         ======================================================= -->

    <section
      class="empty-state"
      id="emptyState"
      hidden
      aria-live="polite"
    >

      <div class="empty-state-inner">

        <span class="empty-state-mark">
          ✦
        </span>

        <h2>
          Nothing here yet.
        </h2>

        <p>
          New visual moments are coming soon.
        </p>

      </div>

    </section>

  </main>


  <!-- =========================================================
       STICKY MOBILE NAVIGATION
       ========================================================= -->

  <nav
    class="bottom-nav"
    aria-label="Primary navigation"
  >

    <a
      href="index.html"
      class="bottom-nav-item is-active"
      aria-current="page"
    >

      <span
        class="bottom-nav-icon"
        aria-hidden="true"
      >
        ⌂
      </span>

      <span class="bottom-nav-label">
        Home
      </span>

    </a>


    <a
      href="explore.html"
      class="bottom-nav-item"
    >

      <span
        class="bottom-nav-icon"
        aria-hidden="true"
      >
        ◇
      </span>

      <span class="bottom-nav-label">
        Explore
      </span>

    </a>


    <a
      href="create.html"
      class="bottom-nav-item"
    >

      <span
        class="bottom-nav-icon"
        aria-hidden="true"
      >
        ＋
      </span>

      <span class="bottom-nav-label">
        Create
      </span>

    </a>

  </nav>


  <!-- =========================================================
       SCRIPT
       ========================================================= -->

  <script>

    /*
     * ==========================================================
     * FEELFRAME™ HOME
     * ==========================================================
     *
     * Data source:
     *      data.json
     *
     * Featured stories:
     *      featured === true
     *
     * Main functions:
     *      - Load JSON
     *      - Render featured Cover Flow
     *      - Render story board
     *      - Previous / next controls
     *      - Dot navigation
     *      - Keyboard navigation
     *      - Pointer / touch dragging
     *      - Story click-through
     * ==========================================================
     */


    /* ==========================================================
       GLOBAL STATE
       ========================================================== */

    let allStories = [];

    let featuredStories = [];

    let currentCoverflowIndex = 0;

    let isDragging = false;

    let dragStartX = 0;

    let dragCurrentX = 0;

    let dragMoved = false;


    /* ==========================================================
       DOM REFERENCES
       ========================================================== */

    const coverflowViewport =
      document.getElementById("coverflowViewport");

    const coverflowTrack =
      document.getElementById("coverflowTrack");

    const coverflowPrev =
      document.getElementById("coverflowPrev");

    const coverflowNext =
      document.getElementById("coverflowNext");

    const coverflowDots =
      document.getElementById("coverflowDots");

    const storyBoard =
      document.getElementById("storyBoard");

    const emptyState =
      document.getElementById("emptyState");


    /* ==========================================================
       LOAD DATA
       ========================================================== */

    async function loadStories() {

      try {

        const response = await fetch("data.json", {
          cache: "no-store"
        });


        if (!response.ok) {
          throw new Error(
            `Unable to load data.json (${response.status})`
          );
        }


        const data = await response.json();


        /*
         * Support either:
         *
         * [
         *   {...},
         *   {...}
         * ]
         *
         * or:
         *
         * {
         *   stories: [...]
         * }
         */

        if (Array.isArray(data)) {

          allStories = data;

        } else if (
          data &&
          Array.isArray(data.stories)
        ) {

          allStories = data.stories;

        } else if (
          data &&
          Array.isArray(data.products)
        ) {

          allStories = data.products;

        } else {

          allStories = [];

        }


        /*
         * Featured stories
         */

        featuredStories =
          allStories.filter(
            story => story.featured === true
          );


        /*
         * Render everything
         */

        renderCoverflow();

        renderStoryBoard();


      } catch (error) {

        console.error(
          "FeelFrame data loading error:",
          error
        );


        featuredStories = [];

        allStories = [];


        renderEmptyState();

      }

    }


    /* ==========================================================
       COVER FLOW
       ========================================================== */

    function renderCoverflow() {

      coverflowTrack.innerHTML = "";

      coverflowDots.innerHTML = "";


      if (!featuredStories.length) {

        coverflowTrack.innerHTML = `
          <div class="coverflow-empty">
            <span class="coverflow-empty-mark">✦</span>
            <p>Featured moments are coming soon.</p>
          </div>
        `;

        coverflowPrev.disabled = true;

        coverflowNext.disabled = true;

        return;

      }


      /*
       * Enable controls
       */

      coverflowPrev.disabled =
        featuredStories.length <= 1;

      coverflowNext.disabled =
        featuredStories.length <= 1;


      /*
       * Create cards
       */

      featuredStories.forEach(
        (story, index) => {

          const card =
            createCoverflowCard(
              story,
              index
            );

          coverflowTrack.appendChild(card);

        }
      );


      /*
       * Create dots
       */

      featuredStories.forEach(
        (story, index) => {

          const dot =
            document.createElement("button");

          dot.type = "button";

          dot.className =
            "coverflow-dot";

          dot.setAttribute(
            "aria-label",
            `Show featured story ${index + 1}`
          );

          dot.setAttribute(
            "role",
            "tab"
          );

          dot.addEventListener(
            "click",
            () => {

              currentCoverflowIndex = index;

              updateCoverflow();

            }
          );


          coverflowDots.appendChild(dot);

        }
      );


      /*
       * Initial position
       */

      currentCoverflowIndex = 0;

      updateCoverflow();

    }


    /* ==========================================================
       CREATE COVER FLOW CARD
       ========================================================== */

    function createCoverflowCard(
      story,
      index
    ) {

      const card =
        document.createElement("article");


      card.className =
        "coverflow-card";


      card.dataset.index =
        index;


      /*
       * Extract content safely
       */

      const image =
        story.image ||
        story.cover ||
        story.thumbnail ||
        "";


      const title =
        story.title ||
        story.name ||
        "Untitled moment";


      const emotion =
        story.emotion ||
        "";


      const campaign =
        story.campaign ||
        story.moment ||
        "";


      const style =
        story.style ||
        story.visualLanguage ||
        "";


      const quote =
        story.quote ||
        "";


      /*
       * Card HTML
       */

      card.innerHTML = `

        <div class="coverflow-card-inner">

          <div class="coverflow-image-wrap">

            ${
              image
                ? `
                  <img
                    class="coverflow-image"
                    src="${escapeAttribute(image)}"
                    alt="${escapeAttribute(title)}"
                    loading="lazy"
                    draggable="false"
                  />
                `
                : `
                  <div
                    class="coverflow-image coverflow-image-placeholder"
                    aria-hidden="true"
                  >
                    <span>FeelFrame™</span>
                  </div>
                `
            }

          </div>


          <div class="coverflow-card-content">

            ${
              campaign
                ? `
                  <span class="coverflow-campaign">
                    ${escapeHTML(campaign)}
                  </span>
                `
                : ""
            }


            <h3 class="coverflow-card-title">
              ${escapeHTML(title)}
            </h3>


            ${
              quote
                ? `
                  <p class="coverflow-card-quote">
                    ${escapeHTML(quote)}
                  </p>
                `
                : ""
            }


            <div class="coverflow-card-meta">

              ${
                emotion
                  ? `
                    <span>
                      ${escapeHTML(emotion)}
                    </span>
                  `
                  : ""
              }


              ${
                style
                  ? `
                    <span>
                      ${escapeHTML(style)}
                    </span>
                  `
                  : ""
              }

            </div>

          </div>

        </div>

      `;


      /*
       * Card click
       */

      card.addEventListener(
        "click",
        () => {

          if (dragMoved) {
            return;
          }


          const storyId =
            story.id;


          if (!storyId) {
            return;
          }


          window.location.href =
            `story.html?id=${encodeURIComponent(storyId)}`;

        }
      );


      return card;

    }


    /* ==========================================================
       UPDATE COVER FLOW
       ========================================================== */

    function updateCoverflow() {

      const cards =
        Array.from(
          coverflowTrack.querySelectorAll(
            ".coverflow-card"
          )
        );


      const dots =
        Array.from(
          coverflowDots.querySelectorAll(
            ".coverflow-dot"
          )
        );


      cards.forEach(
        (card, index) => {

          const relativePosition =
            getRelativePosition(
              index,
              currentCoverflowIndex,
              featuredStories.length
            );


          /*
           * Reset state classes
           */

          card.classList.remove(
            "is-center",
            "is-left",
            "is-right",
            "is-far-left",
            "is-far-right",
            "is-hidden"
          );


          /*
           * Assign visual state
           */

          if (relativePosition === 0) {

            card.classList.add(
              "is-center"
            );

          } else if (
            relativePosition === -1
          ) {

            card.classList.add(
              "is-left"
            );

          } else if (
            relativePosition === 1
          ) {

            card.classList.add(
              "is-right"
            );

          } else if (
            relativePosition === -2
          ) {

            card.classList.add(
              "is-far-left"
            );

          } else if (
            relativePosition === 2
          ) {

            card.classList.add(
              "is-far-right"
            );

          } else {

            card.classList.add(
              "is-hidden"
            );

          }


          /*
           * Accessibility
           */

          const isCenter =
            relativePosition === 0;


          card.setAttribute(
            "aria-hidden",
            isCenter
              ? "false"
              : "true"
          );


          card.tabIndex =
            isCenter
              ? 0
              : -1;

        }
      );


      /*
       * Update dots
       */

      dots.forEach(
        (dot, index) => {

          const active =
            index === currentCoverflowIndex;


          dot.classList.toggle(
            "is-active",
            active
          );


          dot.setAttribute(
            "aria-selected",
            active
              ? "true"
              : "false"
          );

        }
      );

    }


    /* ==========================================================
       RELATIVE POSITION
       ========================================================== */

    function getRelativePosition(
      index,
      activeIndex,
      total
    ) {

      if (total <= 1) {
        return index === activeIndex
          ? 0
          : 99;
      }


      let difference =
        index - activeIndex;


      /*
       * Circular wrapping
       */

      if (
        difference >
        total / 2
      ) {

        difference -= total;

      }


      if (
        difference <
        -total / 2
      ) {

        difference += total;

      }


      return difference;

    }


    /* ==========================================================
       PREVIOUS
       ========================================================== */

    function showPrevious() {

      if (
        featuredStories.length <= 1
      ) {
        return;
      }


      currentCoverflowIndex =
        (
          currentCoverflowIndex -
          1 +
          featuredStories.length
        ) %
        featuredStories.length;


      updateCoverflow();

    }


    /* ==========================================================
       NEXT
       ========================================================== */

    function showNext() {

      if (
        featuredStories.length <= 1
      ) {
        return;
      }


      currentCoverflowIndex =
        (
          currentCoverflowIndex +
          1
        ) %
        featuredStories.length;


      updateCoverflow();

    }


    /* ==========================================================
       BUTTON CONTROLS
       ========================================================== */

    coverflowPrev.addEventListener(
      "click",
      showPrevious
    );


    coverflowNext.addEventListener(
      "click",
      showNext
    );


    /* ==========================================================
       KEYBOARD CONTROLS
       ========================================================== */

    document.addEventListener(
      "keydown",
      event => {

        if (
          event.key === "ArrowLeft"
        ) {

          showPrevious();

        }


        if (
          event.key === "ArrowRight"
        ) {

          showNext();

        }

      }
    );


    /* ==========================================================
       POINTER / TOUCH DRAG
       ========================================================== */

    coverflowViewport.addEventListener(
      "pointerdown",
      event => {

        /*
         * Only primary pointer
         */

        if (
          event.pointerType === "mouse" &&
          event.button !== 0
        ) {
          return;
        }


        isDragging = true;

        dragMoved = false;

        dragStartX =
          event.clientX;

        dragCurrentX =
          event.clientX;


        coverflowViewport.classList.add(
          "is-dragging"
        );


        try {

          coverflowViewport.setPointerCapture(
            event.pointerId
          );

        } catch (error) {
          /*
           * Pointer capture is not available
           * in every browser environment.
           */
        }

      }
    );


    coverflowViewport.addEventListener(
      "pointermove",
      event => {

        if (!isDragging) {
          return;
        }


        dragCurrentX =
          event.clientX;


        const distance =
          dragCurrentX -
          dragStartX;


        if (
          Math.abs(distance) > 8
        ) {

          dragMoved = true;

        }

      }
    );


    coverflowViewport.addEventListener(
      "pointerup",
      event => {

        if (!isDragging) {
          return;
        }


        const distance =
          dragCurrentX -
          dragStartX;


        isDragging = false;


        coverflowViewport.classList.remove(
          "is-dragging"
        );


        if (
          Math.abs(distance) > 45
        ) {

          if (distance < 0) {

            showNext();

          } else {

            showPrevious();

          }

        }


        /*
         * Delay resetting dragMoved so that
         * the click event generated immediately
         * after pointerup does not open a card.
         */

        window.setTimeout(
          () => {

            dragMoved = false;

          },
          80
        );

      }
    );


    coverflowViewport.addEventListener(
      "pointercancel",
      () => {

        isDragging = false;

        coverflowViewport.classList.remove(
          "is-dragging"
        );


        window.setTimeout(
          () => {

            dragMoved = false;

          },
          80
        );

      }
    );


    /* ==========================================================
       STORY BOARD
       ========================================================== */

    function renderStoryBoard() {

      storyBoard.innerHTML = "";


      if (!allStories.length) {

        renderEmptyState();

        return;

      }


      emptyState.hidden = true;


      allStories.forEach(
        (story, index) => {

          const card =
            createStoryCard(
              story,
              index
            );


          storyBoard.appendChild(card);

        }
      );

    }


    /* ==========================================================
       STORY CARD
       ========================================================== */

    function createStoryCard(
      story,
      index
    ) {

      const card =
        document.createElement("article");


      card.className =
        "story-card";


      /*
       * Preserve natural variation for
       * Pinterest-style layout.
       */

      if (
        index % 7 === 0
      ) {

        card.classList.add(
          "story-card-large"
        );

      }


      if (
        index % 9 === 4
      ) {

        card.classList.add(
          "story-card-tall"
        );

      }


      const image =
        story.image ||
        story.cover ||
        story.thumbnail ||
        "";


      const title =
        story.title ||
        story.name ||
        "Untitled moment";


      const emotion =
        story.emotion ||
        "";


      const campaign =
        story.campaign ||
        story.moment ||
        "";


      const style =
        story.style ||
        story.visualLanguage ||
        "";


      const quote =
        story.quote ||
        "";


      card.innerHTML = `

        <a
          href="story.html?id=${encodeURIComponent(
            story.id || ""
          )}"
          class="story-card-link"
          aria-label="${escapeAttribute(title)}"
        >

          <div class="story-card-image-wrap">

            ${
              image
                ? `
                  <img
                    class="story-card-image"
                    src="${escapeAttribute(image)}"
                    alt="${escapeAttribute(title)}"
                    loading="lazy"
                    draggable="false"
                  />
                `
                : `
                  <div
                    class="story-card-image story-card-placeholder"
                    aria-hidden="true"
                  >
                    <span>FeelFrame™</span>
                  </div>
                `
            }

          </div>


          <div class="story-card-overlay">

            ${
              campaign
                ? `
                  <span class="story-card-campaign">
                    ${escapeHTML(campaign)}
                  </span>
                `
                : ""
            }


            <h3 class="story-card-title">
              ${escapeHTML(title)}
            </h3>


            ${
              quote
                ? `
                  <p class="story-card-quote">
                    ${escapeHTML(quote)}
                  </p>
                `
                : ""
            }


            <div class="story-card-meta">

              ${
                emotion
                  ? `
                    <span>
                      ${escapeHTML(emotion)}
                    </span>
                  `
                  : ""
              }


              ${
                style
                  ? `
                    <span>
                      ${escapeHTML(style)}
                    </span>
                  `
                  : ""
              }

            </div>

          </div>

        </a>

      `;


      return card;

    }


    /* ==========================================================
       EMPTY STATE
       ========================================================== */

    function renderEmptyState() {

      emptyState.hidden = false;

      storyBoard.innerHTML = "";

    }


    /* ==========================================================
       HTML ESCAPING
       ========================================================== */

    function escapeHTML(
      value
    ) {

      return String(value)
        .replace(
          /&/g,
          "&amp;"
        )
        .replace(
          /</g,
          "&lt;"
        )
        .replace(
          />/g,
          "&gt;"
        )
        .replace(
          /"/g,
          "&quot;"
        )
        .replace(
          /'/g,
          "&#039;"
        );

    }


    /* ==========================================================
       ATTRIBUTE ESCAPING
       ========================================================== */

    function escapeAttribute(
      value
    ) {

      return escapeHTML(
        value
      );

    }


    /* ==========================================================
       INITIALIZE
       ========================================================== */

    loadStories();

  </script>

</body>
</html>
