<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  />

  <meta
    name="description"
    content="FeelFrame™ — visual stories for human moments. Some feelings deserve to be seen."
  />

  <meta name="theme-color" content="#f5f3ee" />

  <title>FeelFrame™ — Some feelings deserve to be seen.</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

  <link
    href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap"
    rel="stylesheet"
  />

  <link rel="stylesheet" href="style.css" />

  <style>
    /* =========================================================
       FEELFRAME™ HOME — PAGE-SPECIFIC UPGRADES
       ========================================================= */

    :root {
      --ff-bg: #f5f3ee;
      --ff-paper: #fbfaf7;
      --ff-ink: #151515;
      --ff-muted: #77736b;
      --ff-line: rgba(21, 21, 21, 0.1);
      --ff-accent: #b98a3a;
      --ff-radius: 24px;
    }

    /* ---------------------------------------------------------
       HOME WRAPPER
       --------------------------------------------------------- */

    .home-page {
      min-height: 100vh;
      background: var(--ff-bg);
      color: var(--ff-ink);
      padding-bottom: 96px;
    }

    .home-container {
      width: min(1380px, calc(100% - 40px));
      margin: 0 auto;
    }

    /* ---------------------------------------------------------
       TOP NAV
       --------------------------------------------------------- */

    .home-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 28px 0 10px;
    }

    .home-logo {
      color: inherit;
      text-decoration: none;
      font-size: 1rem;
      font-weight: 700;
      letter-spacing: -0.03em;
    }

    .home-create-link {
      display: inline-flex;
      align-items: center;
      gap: 7px;

      color: var(--ff-ink);
      text-decoration: none;

      font-size: 0.86rem;
      font-weight: 600;

      transition:
        transform 0.25s ease,
        opacity 0.25s ease;
    }

    .home-create-link:hover {
      transform: translateX(3px);
      opacity: 0.65;
    }

    /* ---------------------------------------------------------
       HERO
       --------------------------------------------------------- */

    .home-hero {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 40px;

      padding: 92px 0 62px;
    }

    .home-hero-title {
      max-width: 820px;
      margin: 0;

      font-family: "Playfair Display", Georgia, serif;
      font-size: clamp(3.5rem, 8vw, 8.4rem);
      line-height: 0.9;
      font-weight: 500;
      letter-spacing: -0.065em;
    }

    .home-hero-title span {
      display: block;
    }

    .home-hero-title span:last-child {
      padding-left: clamp(30px, 8vw, 130px);
    }

    .home-hero-cta {
      flex: 0 0 auto;
      display: inline-flex;
      align-items: center;
      gap: 12px;

      padding: 14px 20px;

      border: 1px solid var(--ff-line);
      border-radius: 999px;

      background: rgba(255, 255, 255, 0.38);
      color: var(--ff-ink);

      text-decoration: none;
      font-size: 0.84rem;
      font-weight: 600;

      backdrop-filter: blur(12px);

      transition:
        transform 0.3s ease,
        background 0.3s ease;
    }

    .home-hero-cta:hover {
      transform: translateY(-3px);
      background: rgba(255, 255, 255, 0.75);
    }

    .home-hero-cta-arrow {
      font-size: 1rem;
      transition: transform 0.3s ease;
    }

    .home-hero-cta:hover .home-hero-cta-arrow {
      transform: translateX(4px);
    }

    /* ---------------------------------------------------------
       FEATURED COVERFLOW SECTION
       --------------------------------------------------------- */

    .featured-section {
      position: relative;
      width: 100%;

      margin: 0 calc(50% - 50vw);
      width: 100vw;

      overflow: hidden;
      padding: 10px 0 30px;
    }

    .featured-label {
      width: min(1380px, calc(100% - 40px));
      margin: 0 auto 20px;

      font-size: 0.68rem;
      font-weight: 700;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--ff-muted);
    }

    .coverflow-viewport {
      position: relative;
      width: 100%;
      height: 570px;

      perspective: 1400px;
      perspective-origin: center center;

      touch-action: pan-y;
      cursor: grab;
      user-select: none;
    }

    .coverflow-viewport.is-dragging {
      cursor: grabbing;
    }

    .coverflow-track {
      position: absolute;
      inset: 0;

      display: flex;
      align-items: center;
      justify-content: center;

      transform-style: preserve-3d;
    }

    .coverflow-card {
      position: absolute;

      width: min(390px, 29vw);
      height: 500px;

      border-radius: 26px;
      overflow: hidden;

      background: #ddd;

      box-shadow:
        0 25px 70px rgba(0, 0, 0, 0.16),
        0 4px 14px rgba(0, 0, 0, 0.08);

      transform-style: preserve-3d;

      transition:
        transform 0.65s cubic-bezier(0.2, 0.8, 0.2, 1),
        opacity 0.45s ease,
        filter 0.45s ease,
        box-shadow 0.45s ease;

      will-change: transform;
      cursor: pointer;
    }

    .coverflow-card-image {
      width: 100%;
      height: 100%;

      object-fit: cover;
      display: block;

      pointer-events: none;
    }

    .coverflow-card::after {
      content: "";

      position: absolute;
      inset: 0;

      background:
        linear-gradient(
          to top,
          rgba(0, 0, 0, 0.64) 0%,
          rgba(0, 0, 0, 0.18) 35%,
          rgba(0, 0, 0, 0) 65%
        );

      pointer-events: none;
    }

    .coverflow-card-content {
      position: absolute;
      z-index: 2;

      left: 24px;
      right: 24px;
      bottom: 24px;

      color: white;
      pointer-events: none;
    }

    .coverflow-card-campaign {
      margin-bottom: 7px;

      font-size: 0.63rem;
      font-weight: 700;
      letter-spacing: 0.15em;
      text-transform: uppercase;

      opacity: 0.76;
    }

    .coverflow-card-title {
      margin: 0;

      font-family: "Playfair Display", Georgia, serif;
      font-size: clamp(1.5rem, 2.4vw, 2.2rem);
      line-height: 1;
      font-weight: 500;
      letter-spacing: -0.035em;
    }

    .coverflow-card-emotion {
      margin-top: 9px;

      font-size: 0.76rem;
      opacity: 0.82;
    }

    /* ---------------------------------------------------------
       COVERFLOW POSITIONS
       --------------------------------------------------------- */

    .coverflow-card.is-center {
      z-index: 5;
      opacity: 1;
      filter: none;

      transform:
        translate3d(0, 0, 160px)
        rotateY(0deg)
        scale(1);
    }

    .coverflow-card.is-left {
      z-index: 4;
      opacity: 0.88;
      filter: saturate(0.88);

      transform:
        translate3d(-31vw, 0, -60px)
        rotateY(34deg)
        scale(0.86);
    }

    .coverflow-card.is-right {
      z-index: 4;
      opacity: 0.88;
      filter: saturate(0.88);

      transform:
        translate3d(31vw, 0, -60px)
        rotateY(-34deg)
        scale(0.86);
    }

    .coverflow-card.is-far-left {
      z-index: 2;
      opacity: 0.3;
      filter: saturate(0.65);

      transform:
        translate3d(-57vw, 0, -180px)
        rotateY(48deg)
        scale(0.72);
    }

    .coverflow-card.is-far-right {
      z-index: 2;
      opacity: 0.3;
      filter: saturate(0.65);

      transform:
        translate3d(57vw, 0, -180px)
        rotateY(-48deg)
        scale(0.72);
    }

    .coverflow-card.is-hidden {
      z-index: 0;
      opacity: 0;
      pointer-events: none;

      transform:
        translate3d(0, 0, -300px)
        scale(0.55);
    }

    /* ---------------------------------------------------------
       COVERFLOW CONTROLS
       --------------------------------------------------------- */

    .coverflow-controls {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 16px;

      margin-top: 4px;
    }

    .coverflow-arrow {
      width: 40px;
      height: 40px;

      display: grid;
      place-items: center;

      border: 1px solid var(--ff-line);
      border-radius: 50%;

      background: rgba(255, 255, 255, 0.55);
      color: var(--ff-ink);

      cursor: pointer;

      transition:
        transform 0.25s ease,
        background 0.25s ease;
    }

    .coverflow-arrow:hover {
      transform: translateY(-2px);
      background: white;
    }

    .coverflow-dots {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .coverflow-dot {
      width: 5px;
      height: 5px;

      border: 0;
      border-radius: 50%;

      padding: 0;
      background: rgba(21, 21, 21, 0.2);

      cursor: pointer;

      transition:
        width 0.3s ease,
        border-radius 0.3s ease,
        background 0.3s ease;
    }

    .coverflow-dot.is-active {
      width: 25px;
      border-radius: 999px;
      background: var(--ff-ink);
    }

    /* ---------------------------------------------------------
       MORE STORIES
       --------------------------------------------------------- */

    .stories-section {
      padding: 92px 0 40px;
    }

    .stories-heading-row {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 30px;

      margin-bottom: 28px;
    }

    .stories-label {
      margin: 0;

      font-size: 0.68rem;
      font-weight: 700;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--ff-muted);
    }

    .stories-explore-link {
      display: inline-flex;
      align-items: center;
      gap: 8px;

      color: var(--ff-ink);
      text-decoration: none;

      font-size: 0.78rem;
      font-weight: 600;

      transition:
        transform 0.25s ease,
        opacity 0.25s ease;
    }

    .stories-explore-link:hover {
      transform: translateX(4px);
      opacity: 0.6;
    }

    /* ---------------------------------------------------------
       BENTO / PINTEREST BOARD
       --------------------------------------------------------- */

    .home-story-grid {
      column-count: 4;
      column-gap: 18px;
    }

    .home-story-card {
      position: relative;

      display: block;

      width: 100%;
      margin: 0 0 18px;

      break-inside: avoid;

      color: inherit;
      text-decoration: none;

      border-radius: var(--ff-radius);
      overflow: hidden;

      background: var(--ff-paper);

      transform: translateZ(0);

      transition:
        transform 0.35s ease,
        box-shadow 0.35s ease;
    }

    .home-story-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 18px 45px rgba(0, 0, 0, 0.09);
    }

    .home-story-card-image-wrap {
      position: relative;
      overflow: hidden;
      background: #e8e5de;
    }

    .home-story-card-image {
      display: block;
      width: 100%;
      height: auto;

      object-fit: cover;

      transition: transform 0.6s cubic-bezier(0.2, 0.8, 0.2, 1);
    }

    .home-story-card:hover .home-story-card-image {
      transform: scale(1.035);
    }

    .home-story-card-body {
      padding: 18px 18px 20px;
    }

    .home-story-card-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;

      margin-bottom: 10px;

      font-size: 0.62rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;

      color: var(--ff-muted);
    }

    .home-story-card-title {
      margin: 0;

      font-family: "Playfair Display", Georgia, serif;
      font-size: clamp(1.35rem, 2vw, 1.8rem);
      line-height: 1.02;
      font-weight: 500;
      letter-spacing: -0.035em;
    }

    .home-story-card-description {
      margin: 12px 0 0;

      font-size: 0.78rem;
      line-height: 1.55;
      color: var(--ff-muted);
    }

    /* ---------------------------------------------------------
       PROMPT PRODUCT TEASER
       --------------------------------------------------------- */

    .prompt-product {
      margin-top: 16px;
      padding: 16px;

      border: 1px solid rgba(21, 21, 21, 0.09);
      border-radius: 18px;

      background: rgba(255, 255, 255, 0.48);

      transition:
        background 0.25s ease,
        transform 0.25s ease;
    }

    .home-story-card:hover .prompt-product {
      background: rgba(255, 255, 255, 0.76);
    }

    .prompt-product-title {
      display: flex;
      align-items: flex-start;
      gap: 8px;

      margin: 0;

      font-size: 0.72rem;
      line-height: 1.35;
      font-weight: 700;
      letter-spacing: 0.02em;
    }

    .prompt-lock {
      flex: 0 0 auto;
    }

    .prompt-product-description {
      margin: 7px 0 13px;

      font-size: 0.68rem;
      line-height: 1.45;

      color: var(--ff-muted);
    }

    .prompt-product-bottom {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
    }

    .prompt-price {
      display: flex;
      align-items: baseline;
      flex-wrap: wrap;
      gap: 7px;
    }

    .prompt-old-price {
      font-size: 0.69rem;
      color: #99958d;
      text-decoration: line-through;
      text-decoration-thickness: 1px;
    }

    .prompt-current-price {
      font-size: 0.95rem;
      font-weight: 800;
      letter-spacing: -0.02em;
    }

    .prompt-get-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 5px;

      padding: 9px 12px;

      border: 0;
      border-radius: 999px;

      background: var(--ff-ink);
      color: white;

      font-size: 0.67rem;
      font-weight: 700;

      text-decoration: none;
      white-space: nowrap;

      cursor: pointer;

      transition:
        transform 0.25s ease,
        opacity 0.25s ease;
    }

    .prompt-get-button:hover {
      transform: translateY(-2px);
      opacity: 0.82;
    }

    /* ---------------------------------------------------------
       EMPTY / ERROR STATES
       --------------------------------------------------------- */

    .home-empty {
      padding: 60px 20px;
      text-align: center;

      color: var(--ff-muted);
      font-size: 0.9rem;
    }

    /* ---------------------------------------------------------
       STICKY BOTTOM NAV
       --------------------------------------------------------- */

    .home-bottom-nav {
      position: fixed;
      z-index: 100;

      left: 50%;
      bottom: max(16px, env(safe-area-inset-bottom));

      transform: translateX(-50%);

      display: flex;
      align-items: center;
      gap: 5px;

      padding: 6px;

      border: 1px solid rgba(21, 21, 21, 0.08);
      border-radius: 999px;

      background: rgba(250, 249, 246, 0.82);

      box-shadow:
        0 15px 45px rgba(0, 0, 0, 0.12),
        0 2px 8px rgba(0, 0, 0, 0.05);

      backdrop-filter: blur(22px);
      -webkit-backdrop-filter: blur(22px);
    }

    .home-bottom-nav a {
      display: inline-flex;
      align-items: center;
      justify-content: center;

      min-width: 74px;
      height: 38px;

      padding: 0 14px;

      border-radius: 999px;

      color: var(--ff-muted);
      text-decoration: none;

      font-size: 0.7rem;
      font-weight: 600;

      transition:
        background 0.25s ease,
        color 0.25s ease;
    }

    .home-bottom-nav a.active {
      background: var(--ff-ink);
      color: white;
    }

    /* =========================================================
       RESPONSIVE
       ========================================================= */

    @media (max-width: 1050px) {
      .home-story-grid {
        column-count: 3;
      }

      .coverflow-card {
        width: min(370px, 36vw);
      }

      .coverflow-card.is-left {
        transform:
          translate3d(-36vw, 0, -60px)
          rotateY(32deg)
          scale(0.84);
      }

      .coverflow-card.is-right {
        transform:
          translate3d(36vw, 0, -60px)
          rotateY(-32deg)
          scale(0.84);
      }

      .coverflow-card.is-far-left {
        transform:
          translate3d(-65vw, 0, -180px)
          rotateY(46deg)
          scale(0.68);
      }

      .coverflow-card.is-far-right {
        transform:
          translate3d(65vw, 0, -180px)
          rotateY(-46deg)
          scale(0.68);
      }
    }

    @media (max-width: 760px) {
      .home-container {
        width: min(100% - 28px, 680px);
      }

      .home-header {
        padding-top: 21px;
      }

      .home-hero {
        align-items: flex-start;
        flex-direction: column;
        gap: 26px;

        padding: 72px 0 42px;
      }

      .home-hero-title {
        font-size: clamp(3.35rem, 15vw, 6rem);
      }

      .home-hero-title span:last-child {
        padding-left: 25px;
      }

      .home-hero-cta {
        align-self: flex-end;
      }

      .featured-label {
        width: calc(100% - 28px);
      }

      /*
       * MOBILE STILL USES HORIZONTAL COVERFLOW.
       * Cards become narrower/taller so neighboring cards
       * remain visible without destroying the 3D composition.
       */

      .coverflow-viewport {
        height: 490px;
      }

      .coverflow-card {
        width: min(300px, 70vw);
        height: 415px;
        border-radius: 22px;
      }

      .coverflow-card.is-center {
        transform:
          translate3d(0, 0, 120px)
          rotateY(0deg)
          scale(1);
      }

      .coverflow-card.is-left {
        transform:
          translate3d(-54vw, 0, -70px)
          rotateY(36deg)
          scale(0.78);
      }

      .coverflow-card.is-right {
        transform:
          translate3d(54vw, 0, -70px)
          rotateY(-36deg)
          scale(0.78);
      }

      .coverflow-card.is-far-left {
        transform:
          translate3d(-88vw, 0, -180px)
          rotateY(48deg)
          scale(0.6);
      }

      .coverflow-card.is-far-right {
        transform:
          translate3d(88vw, 0, -180px)
          rotateY(-48deg)
          scale(0.6);
      }

      .coverflow-card-content {
        left: 19px;
        right: 19px;
        bottom: 19px;
      }

      .stories-section {
        padding-top: 70px;
      }

      .home-story-grid {
        column-count: 2;
        column-gap: 12px;
      }

      .home-story-card {
        margin-bottom: 12px;
        border-radius: 18px;
      }

      .home-story-card-body {
        padding: 14px 13px 15px;
      }

      .home-story-card-description {
        font-size: 0.7rem;
      }

      .prompt-product {
        padding: 13px;
        border-radius: 15px;
      }

      .prompt-product-bottom {
        align-items: flex-end;
        flex-direction: column;
      }

      .prompt-price {
        width: 100%;
      }

      .prompt-get-button {
        width: 100%;
      }
    }

    @media (max-width: 430px) {
      .home-hero-title {
        font-size: 3.25rem;
      }

      .coverflow-viewport {
        height: 455px;
      }

      .coverflow-card {
        width: 265px;
        height: 390px;
      }

      .coverflow-card.is-left {
        transform:
          translate3d(-61vw, 0, -75px)
          rotateY(38deg)
          scale(0.73);
      }

      .coverflow-card.is-right {
        transform:
          translate3d(61vw, 0, -75px)
          rotateY(-38deg)
          scale(0.73);
      }

      .coverflow-card.is-far-left {
        opacity: 0;
      }

      .coverflow-card.is-far-right {
        opacity: 0;
      }

      .home-story-grid {
        column-count: 2;
        column-gap: 9px;
      }

      .home-story-card {
        margin-bottom: 9px;
        border-radius: 15px;
      }

      .home-story-card-meta {
        font-size: 0.55rem;
      }

      .home-story-card-title {
        font-size: 1.2rem;
      }

      .prompt-product-description {
        font-size: 0.63rem;
      }

      .home-bottom-nav a {
        min-width: 66px;
        padding: 0 11px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .coverflow-card,
      .home-story-card,
      .home-story-card-image,
      .home-create-link,
      .home-hero-cta,
      .coverflow-arrow,
      .stories-explore-link {
        transition: none !important;
      }
    }
  </style>
</head>

<body class="home-page">

  <main>

    <!-- =======================================================
         HEADER
         ======================================================= -->

    <div class="home-container">

      <header class="home-header">

        <a href="index.html" class="home-logo">
          FeelFrame™
        </a>

        <a href="create.html" class="home-create-link">
          Create
          <span aria-hidden="true">↗</span>
        </a>

      </header>


      <!-- =====================================================
           HERO
           ===================================================== -->

      <section class="home-hero">

        <h1 class="home-hero-title">
          <span>Some feelings</span>
          <span>deserve to be seen.</span>
        </h1>

        <a href="create.html" class="home-hero-cta">
          <span>Make it yours</span>
          <span class="home-hero-cta-arrow" aria-hidden="true">→</span>
        </a>

      </section>

    </div>


    <!-- =======================================================
         FEATURED 3D COVERFLOW
         ======================================================= -->

    <section class="featured-section" aria-label="Featured FeelFrame moments">

      <div class="featured-label">
        Featured moments
      </div>

      <div
        class="coverflow-viewport"
        id="coverflowViewport"
        aria-label="Featured visual stories carousel"
      >

        <div
          class="coverflow-track"
          id="coverflowTrack"
        >
          <!-- Cards generated from data.json -->
        </div>

      </div>


      <div class="coverflow-controls">

        <button
          class="coverflow-arrow"
          id="coverflowPrev"
          type="button"
          aria-label="Previous featured story"
        >
          ←
        </button>

        <div
          class="coverflow-dots"
          id="coverflowDots"
          aria-label="Featured story positions"
        ></div>

        <button
          class="coverflow-arrow"
          id="coverflowNext"
          type="button"
          aria-label="Next featured story"
        >
          →
        </button>

      </div>

    </section>


    <!-- =======================================================
         MORE STORIES / PINTEREST BOARD
         ======================================================= -->

    <div class="home-container">

      <section class="stories-section">

        <div class="stories-heading-row">

          <p class="stories-label">
            More FeelFrame stories
          </p>

          <a
            href="explore.html"
            class="stories-explore-link"
          >
            Explore all
            <span aria-hidden="true">→</span>
          </a>

        </div>


        <div
          class="home-story-grid"
          id="homeStoryGrid"
          aria-live="polite"
        >
          <!-- Stories generated from data.json -->
        </div>

      </section>

    </div>

  </main>


  <!-- =========================================================
       STICKY NAV
       ========================================================= -->

  <nav
    class="home-bottom-nav"
    aria-label="Primary navigation"
  >

    <a
      href="index.html"
      class="active"
      aria-current="page"
    >
      Home
    </a>

    <a href="explore.html">
      Explore
    </a>

    <a href="create.html">
      Create
    </a>

  </nav>


  <!-- =========================================================
       HOME SCRIPT
       ========================================================= -->

  <script>

    /* =========================================================
       CONFIG
       ========================================================= */

    const DATA_URL = "data.json";

    let stories = [];
    let featuredStories = [];

    let coverflowIndex = 0;

    let touchStartX = 0;
    let touchCurrentX = 0;
    let isDragging = false;


    /* =========================================================
       DOM
       ========================================================= */

    const homeStoryGrid =
      document.getElementById("homeStoryGrid");

    const coverflowTrack =
      document.getElementById("coverflowTrack");

    const coverflowDots =
      document.getElementById("coverflowDots");

    const coverflowViewport =
      document.getElementById("coverflowViewport");

    const coverflowPrev =
      document.getElementById("coverflowPrev");

    const coverflowNext =
      document.getElementById("coverflowNext");


    /* =========================================================
       ESCAPE HTML
       ========================================================= */

    function escapeHTML(value) {

      if (value === null || value === undefined) {
        return "";
      }

      return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

    }


    /* =========================================================
       FORMAT PRICE
       ========================================================= */

    function formatNaira(value) {

      const number = Number(value);

      if (!Number.isFinite(number)) {
        return "";
      }

      return `₦${number.toLocaleString("en-NG")}`;

    }


    /* =========================================================
       PROMPT PRODUCT
       ========================================================= */

    function createPromptProduct(story) {

      if (!story.promptTitle) {
        return "";
      }

      const currentPrice =
        story.price !== undefined
          ? formatNaira(story.price)
          : "";

      const compareAt =
        story.compareAt !== undefined
          ? formatNaira(story.compareAt)
          : "";

      const hasComparePrice =
        compareAt && currentPrice;


      const priceHTML = hasComparePrice

        ? `
          <div class="prompt-price">
            <span class="prompt-old-price">
              ${escapeHTML(compareAt)}
            </span>

            <span class="prompt-current-price">
              ${escapeHTML(currentPrice)}
            </span>
          </div>
        `

        : `
          <div class="prompt-price">
            <span class="prompt-current-price">
              ${escapeHTML(currentPrice)}
            </span>
          </div>
        `;


      const buttonHTML =
        story.selarUrl &&
        story.selarUrl !== "REAL-SELAR-LINK"

          ? `
            <a
              class="prompt-get-button"
              href="${escapeHTML(story.selarUrl)}"
              target="_blank"
              rel="noopener noreferrer"
              onclick="event.stopPropagation()"
            >
              Get prompt →
            </a>
          `

          : `
            <span
              class="prompt-get-button"
              aria-label="Prompt product coming soon"
            >
              Get prompt →
            </span>
          `;


      return `
        <div class="prompt-product">

          <p class="prompt-product-title">
            <span class="prompt-lock" aria-hidden="true">
              🔐
            </span>

            <span>
              ${escapeHTML(story.promptTitle)}
            </span>
          </p>

          <p class="prompt-product-description">
            The creative prompt behind this visual.
          </p>

          <div class="prompt-product-bottom">

            ${priceHTML}

            ${buttonHTML}

          </div>

        </div>
      `;

    }


    /* =========================================================
       CREATE COVERFLOW CARD
       ========================================================= */

    function createCoverflowCard(story, index) {

      const card = document.createElement("article");

      card.className = "coverflow-card";

      card.dataset.index = index;
      card.dataset.id = story.id || "";

      card.innerHTML = `

        <img
          class="coverflow-card-image"
          src="${escapeHTML(story.image)}"
          alt="${escapeHTML(
            story.title ||
            story.quote ||
            story.emotion ||
            "FeelFrame visual story"
          )}"
          loading="${index === 0 ? "eager" : "lazy"}"
          draggable="false"
        >

        <div class="coverflow-card-content">

          ${
            story.campaign
              ? `
                <div class="coverflow-card-campaign">
                  ${escapeHTML(story.campaign)}
                </div>
              `
              : ""
          }

          <h2 class="coverflow-card-title">
            ${escapeHTML(
              story.title ||
              story.quote ||
              story.moment ||
              "A human moment"
            )}
          </h2>

          ${
            story.emotion
              ? `
                <div class="coverflow-card-emotion">
                  ${escapeHTML(story.emotion)}
                </div>
              `
              : ""
          }

        </div>
      `;


      card.addEventListener("click", () => {

        if (isDragging) {
          return;
        }

        const clickedIndex =
          Number(card.dataset.index);

        if (
          Number.isFinite(clickedIndex) &&
          clickedIndex !== coverflowIndex
        ) {

          coverflowIndex = clickedIndex;

          updateCoverflow();

          return;

        }


        if (story.id) {

          window.location.href =
            `story.html?id=${encodeURIComponent(story.id)}`;

        }

      });


      return card;

    }


    /* =========================================================
       CREATE STORY CARD
       ========================================================= */

    function createStoryCard(story) {

      const link = document.createElement("a");

      link.className = "home-story-card";

      link.href =
        `story.html?id=${encodeURIComponent(story.id)}`;


      const image =
        story.image ||
        "";


      link.innerHTML = `

        <div class="home-story-card-image-wrap">

          <img
            class="home-story-card-image"
            src="${escapeHTML(image)}"
            alt="${escapeHTML(
              story.title ||
              story.quote ||
              story.moment ||
              "FeelFrame visual story"
            )}"
            loading="lazy"
          >

        </div>


        <div class="home-story-card-body">

          <div class="home-story-card-meta">

            <span>
              ${escapeHTML(
                story.campaign ||
                story.moment ||
                "FeelFrame"
              )}
            </span>

            ${
              story.emotion
                ? `
                  <span>
                    ${escapeHTML(story.emotion)}
                  </span>
                `
                : ""
            }

          </div>


          <h2 class="home-story-card-title">

            ${escapeHTML(
              story.title ||
              story.quote ||
              story.moment ||
              "A human moment"
            )}

          </h2>


          ${
            story.description
              ? `
                <p class="home-story-card-description">
                  ${escapeHTML(story.description)}
                </p>
              `
              : story.context
                ? `
                  <p class="home-story-card-description">
                    ${escapeHTML(story.context)}
                  </p>
                `
                : ""
          }


          ${createPromptProduct(story)}

        </div>

      `;


      /*
       * Prevent the prompt purchase interaction from
       * accidentally navigating to the story page.
       */

      const prompt =
        link.querySelector(".prompt-product");

      if (prompt) {

        prompt.addEventListener("click", (event) => {
          event.stopPropagation();
        });

      }


      return link;

    }


    /* =========================================================
       RENDER HOME STORY BOARD
       ========================================================= */

    function renderHomeStories() {

      if (!homeStoryGrid) {
        return;
      }

      homeStoryGrid.innerHTML = "";


      if (!stories.length) {

        homeStoryGrid.innerHTML = `
          <div class="home-empty">
            No stories available yet.
          </div>
        `;

        return;

      }


      stories.forEach((story) => {

        homeStoryGrid.appendChild(
          createStoryCard(story)
        );

      });

    }


    /* =========================================================
       BUILD COVERFLOW
       ========================================================= */

    function buildCoverflow() {

      if (!coverflowTrack) {
        return;
      }

      coverflowTrack.innerHTML = "";

      coverflowDots.innerHTML = "";


      if (!featuredStories.length) {

        coverflowTrack.innerHTML = `
          <div class="home-empty">
            Featured moments will appear here.
          </div>
        `;

        return;

      }


      featuredStories.forEach((story, index) => {

        const card =
          createCoverflowCard(story, index);

        coverflowTrack.appendChild(card);


        const dot =
          document.createElement("button");

        dot.type = "button";

        dot.className = "coverflow-dot";

        dot.setAttribute(
          "aria-label",
          `Go to featured story ${index + 1}`
        );

        dot.addEventListener("click", () => {

          coverflowIndex = index;

          updateCoverflow();

        });


        coverflowDots.appendChild(dot);

      });


      coverflowIndex = 0;

      updateCoverflow();

    }


    /* =========================================================
       COVERFLOW POSITION ENGINE
       ========================================================= */

    function getRelativePosition(
      cardIndex,
      activeIndex,
      total
    ) {

      let difference =
        cardIndex - activeIndex;


      /*
       * Circular positioning means the carousel can
       * continue infinitely.
       */

      if (difference > total / 2) {
        difference -= total;
      }

      if (difference < -total / 2) {
        difference += total;
      }


      return difference;

    }


    function updateCoverflow() {

      const cards =
        Array.from(
          document.querySelectorAll(".coverflow-card")
        );


      const total =
        cards.length;


      if (!total) {
        return;
      }


      cards.forEach((card, index) => {

        const position =
          getRelativePosition(
            index,
            coverflowIndex,
            total
          );


        card.classList.remove(
          "is-center",
          "is-left",
          "is-right",
          "is-far-left",
          "is-far-right",
          "is-hidden"
        );


        if (position === 0) {

          card.classList.add("is-center");

        } else if (position === -1) {

          card.classList.add("is-left");

        } else if (position === 1) {

          card.classList.add("is-right");

        } else if (position === -2) {

          card.classList.add("is-far-left");

        } else if (position === 2) {

          card.classList.add("is-far-right");

        } else {

          card.classList.add("is-hidden");

        }

      });


      const dots =
        Array.from(
          document.querySelectorAll(".coverflow-dot")
        );


      dots.forEach((dot, index) => {

        dot.classList.toggle(
          "is-active",
          index === coverflowIndex
        );

      });

    }


    /* =========================================================
       NEXT / PREVIOUS
       ========================================================= */

    function goNext() {

      if (!featuredStories.length) {
        return;
      }

      coverflowIndex =
        (coverflowIndex + 1) %
        featuredStories.length;

      updateCoverflow();

    }


    function goPrevious() {

      if (!featuredStories.length) {
        return;
      }

      coverflowIndex =
        (
          coverflowIndex -
          1 +
          featuredStories.length
        ) %
        featuredStories.length;

      updateCoverflow();

    }


    coverflowNext.addEventListener(
      "click",
      goNext
    );


    coverflowPrev.addEventListener(
      "click",
      goPrevious
    );


    /* =========================================================
       TOUCH / SWIPE
       ========================================================= */

    coverflowViewport.addEventListener(
      "pointerdown",
      (event) => {

        isDragging = false;

        touchStartX =
          event.clientX;

        touchCurrentX =
          event.clientX;

        coverflowViewport.classList.add(
          "is-dragging"
        );

      }
    );


    coverflowViewport.addEventListener(
      "pointermove",
      (event) => {

        if (
          !touchStartX &&
          touchStartX !== 0
        ) {
          return;
        }


        touchCurrentX =
          event.clientX;


        if (
          Math.abs(
            touchCurrentX - touchStartX
          ) > 8
        ) {

          isDragging = true;

        }

      }
    );


    coverflowViewport.addEventListener(
      "pointerup",
      () => {

        const difference =
          touchCurrentX -
          touchStartX;


        coverflowViewport.classList.remove(
          "is-dragging"
        );


        if (
          Math.abs(difference) > 55
        ) {

          if (difference < 0) {
            goNext();
          } else {
            goPrevious();
          }

        }


        /*
         * Delay reset so the card click handler
         * knows whether this was a swipe.
         */

        setTimeout(() => {

          touchStartX = 0;
          touchCurrentX = 0;
          isDragging = false;

        }, 50);

      }
    );


    coverflowViewport.addEventListener(
      "pointercancel",
      () => {

        coverflowViewport.classList.remove(
          "is-dragging"
        );

        touchStartX = 0;
        touchCurrentX = 0;
        isDragging = false;

      }
    );


    /* =========================================================
       KEYBOARD SUPPORT
       ========================================================= */

    document.addEventListener(
      "keydown",
      (event) => {

        if (event.key === "ArrowRight") {
          goNext();
        }

        if (event.key === "ArrowLeft") {
          goPrevious();
        }

      }
    );


    /* =========================================================
       LOAD DATA
       ========================================================= */

    async function loadHome() {

      try {

        const response =
          await fetch(DATA_URL);


        if (!response.ok) {
          throw new Error(
            `Could not load ${DATA_URL}`
          );
        }


        const data =
          await response.json();


        /*
         * Supports either:
         *
         * [
         *   {...},
         *   {...}
         * ]
         *
         * or:
         *
         * {
         *   stories: [...]
         * }
         */

        stories =
          Array.isArray(data)
            ? data
            : Array.isArray(data.stories)
              ? data.stories
              : [];


        /*
         * FEATURED IS CONTROLLED ENTIRELY BY JSON.
         *
         * Example:
         *
         * "featured": true
         */

        featuredStories =
          stories.filter(
            (story) =>
              story.featured === true
          );


        renderHomeStories();

        buildCoverflow();

      } catch (error) {

        console.error(
          "FeelFrame Home:",
          error
        );


        if (homeStoryGrid) {

          homeStoryGrid.innerHTML = `
            <div class="home-empty">
              FeelFrame stories could not be loaded.
            </div>
          `;

        }

      }

    }


    /* =========================================================
       INIT
       ========================================================= */

    loadHome();

  </script>

</body>
</html>
