<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <meta
    name="description"
    content="A FeelFrame™ visual story — some feelings deserve to be seen."
  >

  <meta name="theme-color" content="#f5f3ee">

  <title>FeelFrame™ — Story</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap"
    rel="stylesheet"
  >

  <link rel="stylesheet" href="style.css">
</head>

<body class="story-page">

  <main>

    <!-- =====================================================
         STORY HEADER
         ===================================================== -->

    <header class="story-header">

      <a
        href="index.html"
        class="story-back"
        aria-label="Go back to FeelFrame home"
      >
        <span aria-hidden="true">←</span>
        <span>Back</span>
      </a>

      <a
        href="index.html"
        class="story-logo"
        aria-label="FeelFrame home"
      >
        FeelFrame™
      </a>

      <a
        href="create.html"
        class="story-create"
      >
        Create
        <span aria-hidden="true">↗</span>
      </a>

    </header>


    <!-- =====================================================
         STORY CONTENT
         ===================================================== -->

    <section
      class="story-content"
      id="storyContent"
      aria-live="polite"
    >

      <!-- JavaScript injects the story here -->

      <div class="story-loading">
        Loading story…
      </div>

    </section>


    <!-- =====================================================
         STORY FOOTER
         ===================================================== -->

    <footer class="site-footer">

      <div class="site-footer-brand">
        FeelFrame™
      </div>

      <p>
        Visual stories for human moments.
      </p>

      <small>
        © 2026 FeelFrame™
      </small>

    </footer>

  </main>


  <!-- =======================================================
       STICKY NAVIGATION
       ======================================================= -->

  <nav
    class="bottom-nav"
    aria-label="Primary navigation"
  >

    <a href="index.html">
      Home
    </a>

    <a href="explore.html">
      Explore
    </a>

    <a
      href="create.html"
      class="bottom-nav-create"
    >
      Create
    </a>

  </nav>


  <script src="script.js"></script>

</body>
</html>
